name: PBS Traffic Monitor

on:
  schedule:
    # 每 5 分鐘自動啟動一次，每次內部輪詢 5 分鐘，達到不間斷每分鐘巡檢
    - cron: '*/5 * * * *'
  workflow_dispatch: # 支援在網頁上一鍵手動觸發

permissions:
  contents: write # 賦予寫入權限，用以保存 state.json

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          pip install requests beautifulsoup4

      - name: 執行路況檢查與推播
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # 加上 -u 參數，強制終端機即時輸出每一秒的日誌，不再卡住或緩衝
        run: |
          python -u traffic_monitor.py

      - name: 保存推播紀錄至 Repository (防重複發報)
        run: |
          if [ -f state.json ]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add state.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "自動更新路況狀態紀錄 [skip ci]" && git push)
          else
            echo "state.json 不存在，略過本次 commit。"
          fi
